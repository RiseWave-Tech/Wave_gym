<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Gym - Neo-Japanese Fitness</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <section id="auth-view" class="view" style="display: none;">
            <div class="enso-container">
                <div class="enso-ring"></div>
                <div class="enso-circle"></div>
            </div>
            <h1>Wave Gym</h1>
            <p class="subtitle">Neo-Japanese Fitness</p>

            <div class="glass-panel">
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Warrior Name</label>
                        <div class="input-wrapper">
                            <span class="material-icons">person</span>
                            <input type="text" id="username" placeholder="Enter your name" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">
                        <span>Start Journey</span>
                        <span class="material-icons">arrow_forward</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Dashboard View -->
        <section id="dashboard-view" class="view" style="display: none;">
            <header class="view-header">
                <h2 id="warrior-name-display">Warrior</h2>
                <p class="subtitle">Daily Progress</p>
            </header>

            <div class="glass-panel">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="xp-display">0</div>
                        <div class="stat-label">Total XP</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="level-display">1</div>
                        <div class="stat-label">Level</div>
                    </div>
                </div>
                <div class="xp-bar-container">
                    <div id="xp-bar-fill" class="xp-bar-fill"></div>
                </div>
                <div class="stat-label" style="text-align: center;">XP to next level</div>
            </div>

            <div class="routines-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Your Routines</h3>
                    <button id="add-routine-btn" class="btn-secondary" style="padding: 5px 10px; font-size: 0.7rem; border-radius: 4px;">+ NEW</button>
                </div>
                <div id="routines-list">
                    <!-- Routines will be injected here -->
                </div>
            </div>

            <div class="db-actions" style="margin-top: 2rem;">
                <button id="import-db-btn" class="btn-secondary">
                    <span class="material-icons">upload_file</span>
                    <span>Import Exercise DB</span>
                </button>
                <input type="file" id="db-file-input" style="display: none;" accept=".json">
            </div>
        </section>

        <!-- Routine Architect View -->
        <section id="routine-architect-view" class="view" style="display: none;">
            <datalist id="exercise-datalist"></datalist>
            <header style="margin-bottom: 2rem;">
                <button class="back-btn" onclick="app.switchView('dashboard')">
                    <span class="material-icons">arrow_back</span>
                </button>
                <h2 style="text-align: center; margin-top: -1.5rem;">Routine Architect</h2>
            </header>

            <div class="glass-panel">
                <div class="input-group">
                    <label>Routine Name</label>
                    <input type="text" id="routine-name-input" placeholder="e.g. Upper Body Power">
                </div>

                <div id="architect-exercises">
                    <!-- Exercises in routine -->
                </div>

                <button id="add-exercise-to-routine-btn" class="btn-secondary" style="margin-top: 1rem;">
                    <span class="material-icons">add</span>
                    <span>Add Exercise</span>
                </button>
            </div>

            <button id="save-routine-btn" class="btn">
                <span>Save Routine</span>
                <span class="material-icons">save</span>
            </button>
        </section>

        <!-- Workout Engine View -->
        <section id="workout-engine-view" class="view" style="display: none;">
            <div id="workout-overlay"></div>

            <header style="margin-bottom: 1rem; position: relative; z-index: 10;">
                <button class="back-btn" onclick="app.confirmEndWorkout()">
                    <span class="material-icons">close</span>
                </button>
                <h2 id="current-workout-name" style="text-align: center; margin-top: -1.5rem;">Workout</h2>
            </header>

            <div id="exercise-card" class="glass-panel" style="position: relative; z-index: 10;">
                <div id="workout-active-content">
                    <h3 id="current-exercise-name" style="color: var(--action-red);">Exercise Name</h3>
                    <div class="stats-grid" style="margin-top: 1rem;">
                    <div class="stat-card">
                        <div class="stat-value" id="set-counter">1 / 3</div>
                        <div class="stat-label">Sets</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="power-score-current">0</div>
                        <div class="stat-label">Power Score</div>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 1rem;">
                    <div style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label>Weight (kg)</label>
                            <input type="number" id="weight-input" value="0">
                        </div>
                        <div style="flex: 1;">
                            <label>Reps</label>
                            <input type="number" id="reps-input" value="0">
                        </div>
                    </div>
                </div>

                </div>

                <div id="timer-container" style="display: none;">
                    <div class="timer-display" id="timer-display">00:00</div>
                    <p style="text-align: center; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem;">Recovery</p>
                </div>

                <button id="log-set-btn" class="btn" style="margin-top: 1rem;">
                    <span>Complete Set</span>
                    <span class="material-icons">check_circle</span>
                </button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
